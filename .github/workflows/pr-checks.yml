name: CI de Pull Requests (Revisión Automatizada)

# Se ejecuta en cada apertura o nuevo commit contra la rama de integración 'dev'
on:
  pull_request:
    branches: [dev]

jobs:
  validate:
    name: 🛡️ Validación y Calidad de Código
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: ⚡ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🚀 Instalar Dependencias del Monorepo
        # frozen-lockfile garantiza que nadie suba dependencias sin actualizar el pnpm-lock.yaml
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Generar Prisma Client
        # Vital: Necesario antes de typecheck y tests para que los tipos de BD existan
        run: pnpm --filter backend run db:generate

      - name: 🔨 Compilar Packages Compartidos
        # Compila los tipos y utilidades de packages/shared necesarios para el backend y frontend
        run: pnpm --filter shared run build

      - name: 🔒 Auditoría de Seguridad
        # Evaluamos solo dependencias de producción para no bloquear el PR por una vulnerabilidad en una librería de testing
        # Ignoramos GHSA-ggr8-5vv4-36mx que es un falso positivo interno de Prisma (deepmerge-ts)
        run: pnpm audit --prod --audit-level=high --ignore GHSA-ggr8-5vv4-36mx

      - name: 🧹 Lint & Formato
        # Ejecuta el script "lint" en cada package.json de tus apps/packages
        run: pnpm -r run lint

      - name: 🔍 Verificación Estricta de Tipos (TypeScript)
        # Typecheck sin emitir archivos JS para asegurar integridad de interfaces
        run: pnpm -r run typecheck

      - name: 🧪 Ejecución de Pruebas Automatizadas
        # Corre la suite completa de unit/integration tests de backend y frontend
        run: pnpm -r run test

      - name: 📦 Compilación de Producción (Build)
        # Valida que tanto NestJS como Vite/Tailwind compilen a dist sin errores
        run: pnpm -r run build
