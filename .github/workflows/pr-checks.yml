name: 🛡️ Monorepo PR Checks

on:
  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch: 

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # Ajusta a la versión que usen en su equipo

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Recomendado para MVP actual
          cache: 'pnpm'

      - name: 🧩 Instalar dependencias
        # Falla si alguien olvidó commitear el pnpm-lock.yaml actualizado
        run: pnpm install --frozen-lockfile

      - name: 🔒 Auditoría de Seguridad
        # Evaluamos solo dependencias de producción para no bloquear el PR por una vulnerabilidad en una librería de testing
        run: pnpm audit --prod --audit-level=high

      - name: 🧹 Lint & Formato
        # Ejecuta el script "lint" en cada package.json de tus apps/packages
        run: pnpm -r run lint

      - name: 🏷️ Type Checking
        # Ejecuta la validación estricta de TypeScript (tsc --noEmit)
        run: pnpm -r run typecheck

      - name: ⚙️ Pruebas Unitarias
        # Ejecuta los tests de la Plataforma (ej. validación matemática al añadir Sello/Punto)
        run: pnpm -r run test

      - name: 🏗️ Dry Build
        # Intenta compilar Next.js y el backend de Node para asegurar que nada rompe en producción
        run: pnpm -r run build
